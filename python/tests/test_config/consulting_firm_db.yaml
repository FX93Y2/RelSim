entities:
  - name: Location
    rows: 30
    attributes:
      - name: LocationID
        type: pk
      # Note: City and State are generated independently by faker and may not match geographically
      - name: State
        type: string
        generator:
          type: faker
          method: location.state()
      - name: City
        type: string
        generator:
          type: faker
          method: location.city()
  - name: Client
    rows: 20
    attributes:
      - name: ClientID
        type: pk
        generator:
          type: template
          template: "{id}"
          id_offset: 999
      - name: location_id
        type: fk
        ref: Location.LocationID
        generator:
          type: foreign_key
          subtype: many_to_one
      - name: ClientName
        type: string
        generator:
          type: faker
          method: company.name()
      - name: Email
        type: string
        generator:
          type: faker
          method: internet.email()
      - name: PhoneNumber
        type: string
        generator:
          type: faker
          method: phone.number()
  - name: Business_Unit
    rows: 5
    attributes:
      - name: BusinessUnitID
        type: pk
        generator:
          type: template
          template: "{id}"
          id_offset: 1000
      - name: BusinessUnitName
        type: string
        generator:
          type: ordered_list
          values:
            - Retail
            - Healthcare
            - Media & Entertainment
            - Energy
            - Government
  - name: Title
    rows: 6
    attributes:
      - name: TitleID
        type: pk
        generator:
          type: template
          template: "{id}"
          id_offset: 100
      - name: Title
        type: string
        generator:
          type: ordered_list
          values:
            - Consultant
            - Senior Consultant
            - Manager
            - Senior Manager
            - Associate Partner
            - Partner
  - name: Consultant
    type: resource
    rows: 60
    attributes:
      - name: ConsultantID
        type: pk
      - name: BusinessUnitID
        type: fk
        ref: Business_Unit.BusinessUnitID
        generator:
          type: foreign_key
          subtype: many_to_one
      - name: FirstName
        type: string
        generator:
          type: faker
          method: person.firstName()
      - name: LastName
        type: string
        generator:
          type: faker
          method: person.lastName()
      - name: Email
        type: string
        generator:
          type: faker
          method: internet.email()
      - name: Contact
        type: string
        generator:
          type: faker
          method: phone.number()
      - name: resource_type
        type: resource_type
        generator:
          type: distribution
          formula: DISC(0.30, Consultant, 0.30, Senior Consultant, 0.20, Manager, 0.10,
            Senior Manager, 0.05, Associate Partner, 0.05, Partner)
  - name: Consultant_Title_History
    type: bridge
    rows: script
    generator:
      type: script
      path: scripts/generate_title_history.py
      function: generate
    attributes:
      - name: id
        type: pk
      - name: ConsultantID
        type: resource_id
        ref: Consultant.ConsultantID
      - name: TitleID
        type: fk
        ref: Title.TitleID
        generator:
          type: foreign_key
          subtype: many_to_one
      - name: StartDate
        type: date
      - name: EndDate
        type: date
      - name: Salary
        type: decimal(12,2)
  - name: Project_Plan
    type: entity
    rows: n/a
    attributes:
      - name: ProjectID
        type: pk
      - name: ClientID
        type: fk
        ref: Client.ClientID
        generator:
          type: foreign_key
          subtype: many_to_one
      - name: BusinessUnitID
        type: fk
        ref: Business_Unit.BusinessUnitID
        generator:
          type: foreign_key
          subtype: many_to_one
      - name: ProjectName
        type: string
        generator:
          type: faker
          method: company.catchPhrase()
      - name: ProjectType
        type: string
        generator:
          type: distribution
          formula: DISC(0.5, Fixed-Price, 0.5, Time & Materials)
      - name: Fixed_Price_Amount
        type: decimal(12,2)
        generator:
          type: distribution
          formula: UNIF(50000, 500000)
      - name: PlannedStartDate
        type: date
      - name: PlannedEndDate
        type: date
      - name: PlannedExpense
        type: decimal(12,2)
      - name: EstimatedBudget
        type: decimal(12,2)
      - name: PlannedHours
        type: decimal(10,2)
      - name: ProjectStatus
        type: string
      - name: created_at
        type: datetime
  - name: Project_Billing_Rate
    rows: n/a
    attributes:
      - name: id
        type: pk
      - name: ProjectID
        type: entity_id
        generator:
          type: foreign_key
          subtype: many_to_one
        ref: Project_Plan.ProjectID
      - name: TitleID
        type: fk
        generator:
          type: foreign_key
          subtype: many_to_one
        ref: Title.TitleID
      - name: BillingRate
        type: decimal(10,2)
        generator:
          type: distribution
          formula: NORM(275, 50)
  - name: Deliverable
    type: entity
    rows: n/a
    attributes:
      - name: DeliverableID
        type: pk
      - name: ProjectID
        type: entity_id
        ref: Project_Plan.ProjectID
        generator:
          type: foreign_key
          subtype: one_to_many
      - name: DeliverableName
        type: string
        generator:
          type: distribution
          formula: DISC(0.2, Project Plan Development, 0.2, Design, 0.2, Infrastructure
            Implementation, 0.2, Coding and Unit Test, 0.2, System Test)
      - name: PlannedStartDate
        type: date
      - name: PlannedEndDate
        type: date
      - name: ActualStartDate
        type: date
      - name: ActualEndDate
        type: date
      - name: DeliverableFixedPrice
        type: decimal(12,2)
      - name: PlannedExpense
        type: decimal(12,2)
      - name: created_at
        type: datetime
  - name: Deliverable_Title_Plan_Mapping
    type: bridge
    rows: n/a
    attributes:
      - name: id
        type: pk
      - name: DeliverableID
        type: entity_id
        ref: Deliverable.DeliverableID
        generator:
          type: foreign_key
          subtype: many_to_one
      - name: TitleID
        type: fk
        ref: Title.TitleID
        generator:
          type: foreign_key
          subtype: many_to_one
      - name: PlannedHours
        type: decimal(10,2)
        generator:
          type: distribution
          formula: UNIF(30, 120)
  - name: Consultant_Deliverable_Mapping
    type: bridge
    rows: n/a
    attributes:
      - name: id
        type: pk
      - name: DeliverableID
        type: entity_id
        ref: Deliverable.DeliverableID
      - name: ConsultantID
        type: resource_id
        ref: Consultant.ConsultantID
      - name: Month
        type: date
      - name: ActualHours
        type: decimal(10,2)
        generator:
          type: distribution
          formula: UNIF(20, 160)
  - name: Actual_Project_Expense
    rows: n/a
    attributes:
      - name: ExpenseID
        type: pk
      - name: DeliverableID
        type: entity_id
        generator:
          type: foreign_key
          subtype: many_to_one
        ref: Deliverable.DeliverableID
      - name: Date
        type: date
      - name: Amount
        type: decimal(10,2)
        generator:
          type: distribution
          formula: NORM(5000, 2000)
      - name: Description
        type: string
        generator:
          type: faker
          method: commerce.productName()
      - name: Category
        type: string
        generator:
          type: distribution
          formula: DISC(0.3, Travel, 0.25, Software, 0.2, Equipment, 0.15, Facilities,
            0.1, Other)
      - name: Billable
        type: string
        generator:
          type: distribution
          formula: DISC(0.7, Billable, 0.3, Non-Billable)
  - name: Deliverable_Progress_Month
    rows: n/a
    attributes:
      - name: id
        type: pk
      - name: DeliverableID
        type: entity_id
        generator:
          type: foreign_key
          subtype: many_to_one
        ref: Deliverable.DeliverableID
      - name: Report_Month
        type: date
      - name: PercentageComplete
        type: decimal(5,2)
        generator:
          type: distribution
          formula: UNIF(0, 100)
