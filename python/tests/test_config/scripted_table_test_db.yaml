# Test config for scripted table generation
# Consultant (static) + ConsultantTitleHistory (script-generated)

entities:
  - name: Consultant
    type: resource
    rows: 10
    attributes:
      - name: id
        type: pk
      - name: name
        type: string
        generator:
          type: faker
          method: person.fullName()
      - name: resource_type
        type: resource_type
        generator:
          type: distribution
          formula: DISC(0.5, 'Junior', 0.35, 'Senior', 0.15, 'Lead')

  - name: ConsultantTitleHistory
    rows: script
    generator:
      type: script
      path: scripts/generate_title_history.py
      function: generate
    attributes:
      - name: id
        type: pk
      - name: consultant_id
        type: fk
        ref: Consultant.id
      - name: title
        type: string
      - name: start_date
        type: date
      - name: end_date
        type: date
